<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Behavior Detector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 { color: #2d3748; margin-bottom: 8px; font-size: 26px; }
    p.subtitle { color: #718096; margin-bottom: 24px; }

    .upload-box {
      background: white;
      border: 2px dashed #cbd5e0;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      width: 100%;
      max-width: 640px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .upload-box:hover { border-color: #4299e1; }
    .upload-box p { color: #a0aec0; font-size: 16px; }

    input[type=file] { display: none; }

    button {
      margin-top: 16px;
      background: #4299e1;
      color: white;
      border: none;
      padding: 12px 40px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #3182ce; }
    button:disabled { background: #a0aec0; cursor: not-allowed; }

    #preview {
      max-width: 640px;
      width: 100%;
      margin-top: 20px;
      border-radius: 8px;
      display: none;
    }
    #result-img {
      max-width: 640px;
      width: 100%;
      margin-top: 20px;
      border-radius: 8px;
      display: none;
      border: 2px solid #48bb78;
    }

    #status {
      margin-top: 12px;
      color: #718096;
      font-style: italic;
      font-size: 14px;
    }

    #detections {
      margin-top: 16px;
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background: #ebf8ff;
      color: #2b6cb0;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      border: 1px solid #bee3f8;
    }

    .no-detect { color: #e53e3e; font-size: 15px; margin-top: 8px; }
    .result-label {
      margin-top: 16px;
      font-size: 15px;
      color: #2d3748;
      font-weight: bold;
      width: 100%;
    }

    .legend {
      margin-top: 32px;
      background: white;
      border-radius: 12px;
      padding: 20px 28px;
      width: 100%;
      max-width: 640px;
    }
    .legend h3 { color: #2d3748; margin-bottom: 12px; font-size: 15px; }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 14px;
      color: #4a5568;
    }
    .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <h1>🎓 Student Behavior Detector</h1>
  <p class="subtitle">Upload a classroom image — AI will detect student behaviors instantly</p>

  <div class="upload-box" onclick="document.getElementById('fileInput').click()">
    <p>📁 Click to upload an image</p>
    <p style="font-size:13px; margin-top:8px;">Supports JPG, PNG</p>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <img id="preview" alt="Preview">
  <button id="btn" onclick="predict()">🔍 Detect Behaviors</button>
  <div id="status"></div>

  <img id="result-img" alt="Detection Result">
  <div id="detections"></div>

  <div class="legend">
    <h3>📌 Detectable Behaviors</h3>
    <div class="legend-item"><div class="dot" style="background:#00a5ff"></div> Bowing the Head</div>
    <div class="legend-item"><div class="dot" style="background:#ff0000"></div> Leaning Over the Table</div>
    <div class="legend-item"><div class="dot" style="background:#00ff00"></div> Reading</div>
    <div class="legend-item"><div class="dot" style="background:#0000ff"></div> Using Phone</div>
    <div class="legend-item"><div class="dot" style="background:#ffff00"></div> Writing</div>
  </div>

  <script>
    document.getElementById('fileInput').onchange = function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = document.getElementById('preview');
        img.src = ev.target.result;
        img.style.display = 'block';
        document.getElementById('result-img').style.display = 'none';
        document.getElementById('detections').innerHTML = '';
        document.getElementById('status').innerText = '';
      };
      reader.readAsDataURL(file);
    };

    async function predict() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) { alert('Please upload an image first!'); return; }

      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.innerText = 'Analyzing...';
      document.getElementById('status').innerText = 'Running detection, please wait...';
      document.getElementById('detections').innerHTML = '';
      document.getElementById('result-img').style.display = 'none';

      try {
        const formData = new FormData();
        formData.append('file', file);

        const res  = await fetch('/predict', { method: 'POST', body: formData });
        const data = await res.json();

        const img = document.getElementById('result-img');
        img.src = 'data:image/jpeg;base64,' + data.image;
        img.style.display = 'block';
        document.getElementById('preview').style.display = 'none';

        const box = document.getElementById('detections');
        if (data.detections.length === 0) {
          box.innerHTML = '<p class="no-detect">⚠️ No behaviors detected</p>';
        } else {
          box.innerHTML = '<p class="result-label">Detection Results:</p>' +
            data.detections.map(d =>
              `<span class="tag">${d.english.replace(/_/g, ' ')} — ${d.confidence}</span>`
            ).join('');
        }
        document.getElementById('status').innerText = '';

      } catch (err) {
        document.getElementById('status').innerText = '❌ Something went wrong. Please try again.';
      }

      btn.disabled = false;
      btn.innerText = '🔍 Detect Behaviors';
    }
  </script>
</body>
</html>
