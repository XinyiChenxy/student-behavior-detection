# YOLOv5 hyperparameters for sb_no_hr with data augmentation
# augmentation is applied to train set only

lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0

hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4

degrees: 5.0
translate: 0.10
scale: 0.30
shear: 2.0
perspective: 0.0

flipud: 0.0
fliplr: 0.5

mosaic: 1.0
mixup: 0.10
copy_paste: 0.0